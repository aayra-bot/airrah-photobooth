<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airrah Photobooth</title>
</head>

<body>

```
<!-- HOME SCREEN -->
<div id="homeScreen">

    <h1>Airrah Photobooth</h1>

    <p>Make a moment. Keep the frame. 📸</p>

    <button onclick="startPhotobooth()">START</button>

</div>


<!-- PHOTOBOOTH SCREEN -->
<div id="boothScreen" style="display: none;">

    <h1>Choose Your Frame</h1>

    <p>Welcome to the photobooth!</p>

    <button>CLASSIC</button>
    <button>FILM STRIP</button>
    <button>MINIMAL</button>

    <br><br>

    <button onclick="goHome()">← BACK</button>

</div>


<script>

    function startPhotobooth() {

        document.getElementById("homeScreen").style.display = "none";

        document.getElementById("boothScreen").style.display = "block";

    }


    function goHome() {

        document.getElementById("boothScreen").style.display = "none";

        document.getElementById("homeScreen").style.display = "block";

    }

</script>
```

</body>
</html>
